<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | EmpleaEC</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            <span>Emplea</span>EC
        </div>

        <h2>Bienvenido nuevamente</h2>

        <p class="auth-description">
            Inicia sesión para continuar
        </p>

        <form id="loginForm" class="auth-form">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                placeholder="tu@email.com"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Tu contraseña"
                required
            >

            <button
                type="submit"
                class="auth-button">
                Iniciar sesión
            </button>

        </form>

        <div
            id="mensaje"
            class="auth-message">
        </div>

        <p class="auth-link">
            ¿No tienes una cuenta?
            <a href="registro.html">
                Registrarse
            </a>
        </p>

        <a
            href="index.html"
            class="back-home">
            ← Volver al inicio
        </a>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
